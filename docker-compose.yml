services:
  mysql:
    image: mysql:8.4
    container_name: computer-assets-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dev-root-change-me}
      MYSQL_DATABASE: DoAnJava
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - computer-assets-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  computer-assets-data: